plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

repositories {
    // Ponder + its bundled Catnip, and Flywheel, live here.
    maven {
        name = 'CreateMod'
        url = 'https://maven.createmod.net'
    }
}

dependencies {
    // Ponder + Flywheel are embedded into our jar via jarJar (the same way
    // Create ships them), so a player only installs quantumitems.jar and the
    // guide loads automatically. Ponder bundles Catnip inside its own jar;
    // Flywheel is Ponder's client-only render dependency (inert on servers).
    // `implementation` puts them on the compile + dev-run classpath; `jarJar`
    // embeds them (with version ranges) into the packaged artifact.
    implementation "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    implementation "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"

    jarJar("net.createmod.ponder:ponder-neoforge") {
        version {
            strictly "[${ponder_version}+mc${minecraft_version},)"
            prefer "${ponder_version}+mc${minecraft_version}"
        }
    }
    jarJar("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}") {
        version {
            // Loose floor so a co-installed mod shipping a newer Flywheel
            // (e.g. Create) resolves to a single shared copy.
            strictly "[1.0.0,2.0)"
            prefer "${flywheel_version}"
        }
    }
}

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources) {
    var replaceProperties = [mod_version: project.mod_version]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}
