modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mixins]]
config = "quantumitems.mixins.json"

[[mods]]
modId = "quantumitems"
version = "${mod_version}"
displayName = "Quantum Entanglement"
description = '''Entangle item stacks into quantum networks that share a single pool of items across any distance.'''
authors = "avjx2d6"

[[dependencies.quantumitems]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.quantumitems]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

# Ponder provides the in-game guide ("Ponder" on hover). Optional: without it
# the mod runs unchanged, just no visual documentation. Client-only concern.
[[dependencies.quantumitems]]
modId = "ponder"
type = "optional"
versionRange = "[1.0.0,)"
ordering = "AFTER"
side = "CLIENT"
