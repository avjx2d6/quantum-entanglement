modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/avjx2d6/quantumitems/issues"

[[mixins]]
config = "quantumitems.mixins.json"

[[mods]]
modId = "quantumitems"
version = "${mod_version}"
displayName = "Quantum Entanglement"
displayURL = "https://github.com/avjx2d6/quantumitems"
logoFile = "logo.png"
description = '''Entangle item stacks into quantum networks that share a single pool of items across any distance.'''
authors = "avjx2d6"

[[dependencies.quantumitems]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.quantumitems]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

# Ponder provides the in-game guide ("Ponder" on hover). Embedded into this
# jar via jarJar, so it is always present; required on the client where the
# guide lives (a dedicated server needs nothing from it).
[[dependencies.quantumitems]]
modId = "ponder"
type = "required"
versionRange = "[1.0,)"
ordering = "AFTER"
side = "CLIENT"
